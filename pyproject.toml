[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "roguard-child-safety"
version = "3.0.2"
description = "Offline Romanian and Ukrainian child-safety contract and evaluation toolkit"
readme = "docs/PYPI.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "RoGuard contributors"}]
keywords = ["child-safety", "Romanian", "Ukrainian", "evaluation", "guardrails"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/xyz-rafael-xyz/roguard-child-safety"
Repository = "https://github.com/xyz-rafael-xyz/roguard-child-safety"
Documentation = "https://github.com/xyz-rafael-xyz/roguard-child-safety/blob/main/README.md"
Issues = "https://github.com/xyz-rafael-xyz/roguard-child-safety/issues"

[project.scripts]
roguard = "roguard.cli:main"
roguard-pairs = "roguard.pair_eval:main"
roguard-contrast = "roguard.contrast:main"
roguard-agreement = "roguard.agreement:main"
roguard-review-card = "roguard.review_card:main"
roguard-agreement-batch = "roguard.agreement_batch:main"
roguard-blind-packets = "roguard.blind_packets:main"
roguard-review-audit = "roguard.review_audit:main"
roguard-annotate-packet = "roguard.annotate_packet_bound:main"
roguard-human-eval = "roguard.human_eval_bound:main"
roguard-human-eval-registered = "roguard.human_eval_registered:main"
roguard-independent-check = "roguard.independent_check:main"
roguard-author-kit = "roguard.author_kit:main"
roguard-predict-abstract = "roguard.prospective_predict:main"
roguard-predict-bilingual = "roguard.prospective_predict_bilingual:main"
roguard-replay-bilingual = "roguard.prospective_replay_bilingual:main"
roguard-explore = "roguard.explore:main"
roguard-studio = "roguard.studio:main"
roguard-v1-evidence = "roguard.v1_evidence:main"
roguard-v1-contract = "roguard.v1_contract:main"
roguard-v1-explore = "roguard.v1_explore:main"
roguard-v1-envelope = "roguard.v1_envelope:main"
roguard-v2-audit = "roguard.v2_audit:main"
roguard-v1-review = "roguard.v1_review:main"
roguard-v1-annotate = "roguard.v1_study_annotate:main"
roguard-v1-author-check = "roguard.v1_author_check:main"
roguard-message-screen = "roguard.message_model:main"

[project.optional-dependencies]
train = ["numpy>=1.26", "pyyaml>=6", "torch>=2.3", "transformers>=4.46,<5", "peft>=0.13,<1", "accelerate>=1,<2"]
mlx = ["mlx-lm>=0.31.3,<0.32"]
test = ["pytest>=8", "jsonschema>=4.23,<5"]
message-train = ["numpy>=1.26,<3", "scikit-learn>=1.5,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
roguard = ["studio.html", "studio.css", "studio.js", "message-model-*.json.gz"]

[tool.pytest.ini_options]
testpaths = ["tests"]
