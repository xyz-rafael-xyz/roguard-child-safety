<!doctype html><meta charset="utf-8"><title>RoGuard v6 visual walkthrough</title>
<style>html,body{margin:0;background:#0b1220}canvas{display:block}</style><canvas width="1200" height="675"></canvas>
<script>
const c=document.querySelector('canvas'),x=c.getContext('2d');
const C={bg:'#0b1220',panel:'#152239',line:'#2a3b55',text:'#eff5ff',muted:'#a6b6cb',mint:'#7ee4c6',purple:'#b8a5ff',amber:'#ffc484'};
const clamp=v=>Math.max(0,Math.min(1,v)),ease=v=>{v=clamp(v);return v*v*(3-2*v)};
function text(s,a,b,size=22,color=C.text,weight=400){x.fillStyle=color;x.font=`${weight} ${size}px Arial`;x.fillText(s,a,b)}
function box(a,b,w,h,color=C.panel,r=18){x.fillStyle=color;x.beginPath();x.roundRect(a,b,w,h,r);x.fill()}
function line(a,b,d,e,color=C.line,width=2){x.strokeStyle=color;x.lineWidth=width;x.beginPath();x.moveTo(a,b);x.lineTo(d,e);x.stroke()}
function pill(s,a,b,color=C.mint){x.font='bold 14px Arial';let w=x.measureText(s).width+28;box(a,b,w,29,color,14);text(s,a+14,b+20,14,C.bg,700)}
function arrow(a,b,d,e,color=C.mint){line(a,b,d,e,color,3);line(d-8,e-6,d,e,color,3);line(d-8,e+6,d,e,color,3)}
function dot(a,b,r,color){x.fillStyle=color;x.beginPath();x.arc(a,b,r,0,Math.PI*2);x.fill()}
function heading(k,title,sub){text(k,60,142,15,C.mint,700);text(title,60,195,40,C.text,700);text(sub,60,233,20,C.muted)}
function entrance(t){x.globalAlpha=ease(t/.55);x.translate(35*(1-ease(t/.65)),22*(1-ease(t/.65)))}
function intro(t){heading('LANGUAGE × PERMISSION','Understand the signal. Control the action.','Romanian + Ukrainian child-safety research toolkit');
let nodes=[['RO','Romanian',C.mint],['UK','Ukrainian',C.purple]];
nodes.forEach(([a,b,col],i)=>{let yy=310+i*108;box(70,yy,250,84);pill(a,90,yy+25,col);text(b,151,yy+51,23);arrow(340,yy+42,480,yy+42,col);dot(345+130*((t*.35+i*.5)%1),yy+42,5,col)});
box(500,307,286,196);text('RoGuard',533,371,42,C.text,700);pill('v6.0',533,393);text('Review + policy checks',533,464,19,C.muted);
arrow(806,405,880,405);box(900,327,240,156);text('Your application',920,371,22,C.text,700);text('Keeps authority',920,409,20,C.mint);text('over every action',920,441,20,C.muted)}
function signals(t){heading('01 / REVIEW A CONVERSATION','Two languages. One review workflow.','Actual adapted-backend results on two fictional messages.');
['ro','uk'].forEach((lang,i)=>{let a=60+i*555,col=i?C.purple:C.mint;box(a,274,525,284);pill(i?'UKRAINIAN':'ROMANIAN',a+24,294,col);
const words=i?['Мені самотньо і хочеться','з кимось поговорити.']:['Mă simt singur și aș vrea','să vorbesc cu cineva.'];
words.forEach((s,j)=>text(s,a+24,365+j*33,25));
let p=ease((t-.8-i*.4)/.8);x.save();x.globalAlpha=p;box(a+24,446,477,83,'#21324a',12);
const decision=window.facts[lang].output.signal.decision;
text(decision==='INSUFFICIENT_EVIDENCE'?'Insufficient evidence':decision==='REVIEW_SUPPORT_SIGNAL'?'Support signal → review':'No model signal',a+40,479,22,col,700);
text('Advisory output · no automatic notification',a+40,511,17,C.muted);x.restore();
if(t<2){line(a+24,423,a+24+477*clamp(t/2),423,col,3)}})}
function repair(t){heading('02 / PERMISSION-AWARE REPAIR','Share less. Preserve the stated task.','A proposed tutoring export includes lesson content and a private note.');
let p=ease((t-1.3)/1.1);box(60,281,320,222);text('Proposed export',84,317,22,C.text,700);
box(84,340,272,55,'#24433f',10);text('Lesson content',105,375,21,C.mint);
x.save();x.globalAlpha=1-.65*p;box(84,408+16*p,272,55,'#46394a',10);text('Private note',105,443+16*p,21,C.purple);x.restore();
arrow(400,382,490,382);box(510,303,205,160);text('Permission',536,347,23,C.text,700);text('check',536,378,23,C.text,700);pill('REPAIR PROPOSED',529,406,C.amber);
arrow(735,382,825,382);if(t>1.3&&t<2.4){box(84+783*p,340,272-21*p,55,'#24433f',10);text('Lesson content',105+777*p,375,21,C.mint)}x.save();x.globalAlpha=p;box(845,281,295,222);text('Revised proposal',868,317,22,C.text,700);box(867,340,251,55,'#24433f',10);text('Lesson content only',882,375,20,C.mint);text('Private note excluded',868,435,19,C.purple);text('Nothing sent',868,473,19,C.muted);x.restore();
text('Host-declared learning requirement retained. Execution is not authorized.',60,550,20,C.muted)}
function revoke(t){heading('03 / PERMISSION FOLLOWS DERIVATIONS','Revoked at the source. Blocked downstream.','A summary inherits the source’s permission requirements.');
let p=ease((t-1.6)/.5);['Lesson source','Derived summary','Teacher export'].forEach((s,i)=>{let a=60+i*380;box(a,315,320,147);text(s,a+25,355,25,C.text,700);if(i===0)pill(p>.5?'REVOKED':'GRANTED',a+25,391,p>.5?C.amber:C.mint);if(i===1)text('Source link retained',a+25,415,20,C.purple);if(i===2)pill(p>.5?'BLOCK':'ALLOW',a+25,391,p>.5?C.amber:C.mint);if(i<2)arrow(a+328,384,a+368,384,p>.5?C.amber:C.mint)});
if(p<1)dot(90+(t*.35%1)*1000,486,5,C.mint);else{line(1028,474,1028,501,C.amber,4);dot(1008,487,5,C.amber)}
text(p>.5?'The derived summary cannot be exported under the revoked permission.':'The scoped grant permits this policy check.',60,548,22,p>.5?C.amber:C.muted)}
function end(t){heading('LOCAL FIRST / READY TO EXPLORE','Bring your workflow. Inspect every decision.','Model signals inform review; your application controls execution.');
[['Long conversations',C.mint],['Encrypted permission state',C.purple],['Metadata-only monitoring',C.amber]].forEach(([s,col],i)=>{box(60+i*370,292,340,88);dot(83+i*370,335,5,col);text(s,100+i*370,342,20,col,700)});
box(60,412,1080,121);text('INSTALL OR UPDATE',84,446,13,C.mint,700);text('pip install --upgrade roguard-child-safety',84,488,28,C.text,700);text('Optional adapted model requires extra setup · see README',60,571,18,C.muted)}
const scenes=[intro,signals,repair,revoke,end];const durations=[4,6,6,5,5];
window.render=function(time){let t=time%26,start=0,index=0;for(let i=0;i<durations.length;i++){if(t<start+durations[i]){index=i;break}start+=durations[i]};let local=t-start;
x.globalAlpha=1;x.setTransform(1,0,0,1,0,0);box(0,0,1200,675,C.bg,0);
// Quiet flowing lines stay in motion through every scene.
for(let i=0;i<7;i++){let yy=88+i*83;x.strokeStyle='#111e31';x.lineWidth=1;x.beginPath();for(let a=0;a<=1200;a+=10){let b=yy+Math.sin(a/170+time*.3+i)*10;a?x.lineTo(a,b):x.moveTo(a,b)}x.stroke()}
text('RoGuard',60,57,26,C.text,700);pill('6.0',181,35,C.mint);text('ROMANIAN / UKRAINIAN',827,54,14,C.muted,700);
x.save();entrance(local);let out=ease((durations[index]-local)/.4);x.globalAlpha*=out;scenes[index](local);x.restore();
line(60,612,1140,612);text('FICTIONAL EXAMPLES · VISUAL WALKTHROUGH · NO EXTERNAL ACTIONS',60,642,12,C.muted,700);
for(let i=0;i<5;i++){box(944+i*40,633,29,4,i===index?C.mint:C.line,2)};
};
</script>
