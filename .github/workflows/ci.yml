name: CI
on: [push, pull_request, workflow_call]
jobs:
  unit:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e '.[test,gateway,observability]'
      - run: python -m pytest tests -q
      - run: python scripts/verify_public_tree.py
      - run: python -m compileall -q src training eval
      - run: python -m eval.run_assurance_v9 --cases 250 --seed 9101 --output "$RUNNER_TEMP/assurance-audit.json"
      - run: python training/validate_generated.py --batch batch-0035
      - run: python training/validate_generated.py --batch batch-0036
      - run: python training/validate_generated.py --batch batch-0037
      - run: python training/validate_generated.py --batch batch-0038
      - run: roguard --jsonl examples/contracts_mixed.jsonl > /dev/null
      - run: roguard-explore examples/proposed_use_ro.json > /dev/null
      - run: roguard-v1-evidence --root . > /dev/null
      - run: roguard-v1-review --root . > /dev/null
      - run: roguard-v1-contract examples/v1_candidate_ro.json > /dev/null
      - run: roguard-v1-contract examples/v1_candidate_uk.json > /dev/null
      - run: roguard-v1-envelope examples/v1_candidate_ro.json > /dev/null
      - run: roguard-v1-envelope examples/v1_candidate_uk.json > /dev/null
      - run: roguard-v2-audit examples/v2_uncertainty_ro.json > /dev/null
      - run: roguard-v2-audit examples/v2_uncertainty_uk.json > /dev/null
      - run: roguard-message-screen examples/message_screen_ro.json > /dev/null
      - run: roguard-message-screen examples/message_screen_uk.json > /dev/null
      - run: roguard-lab demo --language ro --fail-on-failure > /dev/null
      - run: roguard-lab demo --language uk --fail-on-failure > /dev/null
      - run: roguard-lab suite --fail-on-failure > /dev/null
      - run: roguard-evidence examples/evidence_ro.json > /dev/null
      - run: roguard-evidence examples/evidence_uk.json > /dev/null
      - run: python examples/evidence_tutor.py > /dev/null
      - run: roguard-context examples/context_ro.json --backend character > /dev/null
      - run: roguard-context examples/context_uk.json --backend character > /dev/null
      - run: python examples/context_tutor.py > /dev/null
      - run: roguard-ops repair-demo --language ro > /dev/null
      - run: roguard-ops repair-demo --language uk > /dev/null
      - run: roguard-lab compare --language uk > /dev/null
      - run: roguard-lab consistency examples/lab_surface_conversations.json > /dev/null
      - run: roguard-conversation examples/conversation_ro.json > /dev/null
      - run: roguard-conversation --jsonl examples/conversations.jsonl > /dev/null
      - run: roguard-v1-annotate --help > /dev/null
      - run: roguard-v1-author-check --help > /dev/null
      - run: roguard-contrast examples/contrast_route_before.json examples/contrast_route_after.json > /dev/null
      - run: roguard-contrast examples/contrast_disclosure_before_ro.json examples/contrast_disclosure_after_ro.json > /dev/null
      - run: roguard-contrast examples/contrast_disclosure_before_uk.json examples/contrast_disclosure_after_uk.json > /dev/null
      - run: roguard-agreement examples/contrast_disclosure_before_ro.json examples/contrast_disclosure_after_ro.json > /dev/null
      - run: printf '1\n1\n2\n1\n' | roguard-review-card --language ro > /dev/null
      - run: printf '2\n2\n2\n2\n2\n2\n2\n2\n' | roguard-review-card --language uk --category S1 > /dev/null
      - run: roguard-agreement-batch examples/annotation_demo_ro_a.jsonl examples/annotation_demo_ro_b.jsonl > /dev/null
      - run: roguard-agreement-batch examples/annotation_demo_uk_a.jsonl examples/annotation_demo_uk_b.jsonl > /dev/null
      - run: roguard-blind-packets --batch batch-0035 --category D1 --output-dir "$RUNNER_TEMP/roguard-review-packets" > /dev/null
      - run: roguard-review-audit --help > /dev/null
      - run: roguard-annotate-packet --help > /dev/null
      - run: roguard-human-eval --help > /dev/null
      - run: roguard-human-eval-registered --help > /dev/null
      - run: roguard-independent-check --help > /dev/null
      - run: roguard-author-kit --help > /dev/null
      - run: python -m roguard.review_bundle --language ro --output "$RUNNER_TEMP/roguard-ro-review.zip" > /dev/null
      - run: python -m roguard.review_bundle --language uk --output "$RUNNER_TEMP/roguard-uk-review.zip" > /dev/null
      - run: python -m roguard.review_bundle --language ro --candidate-v1 --output "$RUNNER_TEMP/roguard-ro-v1-review.zip" > /dev/null
      - run: python -m roguard.review_bundle --language uk --candidate-v1 --output "$RUNNER_TEMP/roguard-uk-v1-review.zip" > /dev/null
      - run: roguard-predict-abstract --help > /dev/null
      - run: roguard-predict-bilingual --help > /dev/null
      - run: roguard-replay-bilingual --help > /dev/null

  contextual-readout-math:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install numerical test dependencies
        run: >-
          python -m pip install -e '.[test]'
          numpy==2.5.3 scipy==1.18.1 scikit-learn==1.9.1
          joblib==1.6.0 threadpoolctl==3.7.0 cloudpickle==3.1.2 narwhals==2.27.1
      - name: Require working numerical imports before optional-dependency tests
        run: python -c "from sklearn.linear_model import LogisticRegression; from sklearn.svm import SVC"
      - name: Verify portable scores and per-group accuracy gates
        run: >-
          python -m pytest -q
          tests/test_gemma4_readout.py::test_portable_readout_matches_fitted_classifier_and_rejects_bad_features
          tests/test_gemma4_kernel.py
          tests/test_budgeted_native_frontier.py
          tests/test_entailment_frontier.py
          tests/test_portable_scope_gate.py
          tests/test_contextual_complementarity.py

  wheel-install:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.12', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build and install a wheel outside the checkout
        run: |
          python -m pip wheel . --no-deps --wheel-dir "$RUNNER_TEMP/wheels"
          python -m venv "$RUNNER_TEMP/roguard-wheel-venv"
          "$RUNNER_TEMP/roguard-wheel-venv/bin/python" -m pip install --no-deps "$RUNNER_TEMP"/wheels/*.whl
      - name: Run packaged bilingual CLI and Python API
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/roguard-wheel-venv/bin/python" -m roguard "$GITHUB_WORKSPACE/examples/contracts_ro.json" > ro.json
          "$RUNNER_TEMP/roguard-wheel-venv/bin/python" -m roguard "$GITHUB_WORKSPACE/examples/contracts_uk.json" > uk.json
          "$RUNNER_TEMP/roguard-wheel-venv/bin/python" -c 'from importlib.metadata import metadata; assert metadata("roguard-child-safety")["Name"] == "roguard-child-safety"'
          "$RUNNER_TEMP/roguard-wheel-venv/bin/python" -c 'import json; from pathlib import Path; import roguard; assert not Path(roguard.__file__).is_relative_to(Path(__import__("os").environ["GITHUB_WORKSPACE"])); assert json.load(open("ro.json"))["language"] == "ro"; assert json.load(open("uk.json"))["language"] == "uk"'
          "$RUNNER_TEMP/roguard-wheel-venv/bin/python" -c 'from roguard import RoutingCard, check_routing; card = RoutingCard("minor", "x", "A", "minor", frozenset({"minor"}), {("minor", "x", "A"): frozenset({"minor"})}); assert check_routing(card).reason_codes == ()'
          "$RUNNER_TEMP/roguard-wheel-venv/bin/python" -c 'from importlib import resources; from roguard.studio import make_server; assert b"Decision Studio" in resources.read_binary("roguard", "studio.html"); server = make_server(); server.server_close()'
          "$RUNNER_TEMP/roguard-wheel-venv/bin/roguard-evidence" "$GITHUB_WORKSPACE/examples/evidence_ro.json" > /dev/null
          "$RUNNER_TEMP/roguard-wheel-venv/bin/roguard-evidence" "$GITHUB_WORKSPACE/examples/evidence_uk.json" > /dev/null
          "$RUNNER_TEMP/roguard-wheel-venv/bin/roguard-assure" "$GITHUB_WORKSPACE/examples/assurance_ro.json" > assurance.json
          "$RUNNER_TEMP/roguard-wheel-venv/bin/roguard-assure" assurance.json --verify > /dev/null
          "$RUNNER_TEMP/roguard-wheel-venv/bin/roguard-assure" "$GITHUB_WORKSPACE/examples/evidence_uk.json" --conversation > /dev/null
          "$RUNNER_TEMP/roguard-wheel-venv/bin/roguard-context" "$GITHUB_WORKSPACE/examples/context_ro.json" --backend character > /dev/null
          "$RUNNER_TEMP/roguard-wheel-venv/bin/roguard-context" "$GITHUB_WORKSPACE/examples/context_uk.json" --backend character > /dev/null
          "$RUNNER_TEMP/roguard-wheel-venv/bin/roguard-explore" "$GITHUB_WORKSPACE/examples/proposed_use_ro.json" > /dev/null
          "$RUNNER_TEMP/roguard-wheel-venv/bin/roguard-v1-evidence" --root "$GITHUB_WORKSPACE" > /dev/null
          "$RUNNER_TEMP/roguard-wheel-venv/bin/roguard-v1-review" --root "$GITHUB_WORKSPACE" > /dev/null
          "$RUNNER_TEMP/roguard-wheel-venv/bin/roguard-v1-contract" "$GITHUB_WORKSPACE/examples/v1_candidate_ro.json" > /dev/null
          "$RUNNER_TEMP/roguard-wheel-venv/bin/roguard-v1-contract" "$GITHUB_WORKSPACE/examples/v1_candidate_uk.json" > /dev/null
          "$RUNNER_TEMP/roguard-wheel-venv/bin/roguard-v1-envelope" "$GITHUB_WORKSPACE/examples/v1_candidate_ro.json" > /dev/null
          "$RUNNER_TEMP/roguard-wheel-venv/bin/roguard-v1-envelope" "$GITHUB_WORKSPACE/examples/v1_candidate_uk.json" > /dev/null
          "$RUNNER_TEMP/roguard-wheel-venv/bin/roguard-v2-audit" "$GITHUB_WORKSPACE/examples/v2_uncertainty_ro.json" > /dev/null
          "$RUNNER_TEMP/roguard-wheel-venv/bin/roguard-v2-audit" "$GITHUB_WORKSPACE/examples/v2_uncertainty_uk.json" > /dev/null
          "$RUNNER_TEMP/roguard-wheel-venv/bin/roguard-message-screen" "$GITHUB_WORKSPACE/examples/message_screen_ro.json" > message-ro.json
          "$RUNNER_TEMP/roguard-wheel-venv/bin/roguard-message-screen" "$GITHUB_WORKSPACE/examples/message_screen_uk.json" > message-uk.json
          "$RUNNER_TEMP/roguard-wheel-venv/bin/python" -c 'import json; assert json.load(open("message-ro.json"))["advisory_code"] == "REVIEW_SUPPORT_SIGNAL"; assert json.load(open("message-uk.json"))["advisory_code"] == "REVIEW_SUPPORT_SIGNAL"'
          "$RUNNER_TEMP/roguard-wheel-venv/bin/roguard-lab" demo --language ro --fail-on-failure > /dev/null
          "$RUNNER_TEMP/roguard-wheel-venv/bin/roguard-lab" demo --language uk --fail-on-failure > /dev/null
          "$RUNNER_TEMP/roguard-wheel-venv/bin/roguard-lab" compare > /dev/null
          "$RUNNER_TEMP/roguard-wheel-venv/bin/python" -c 'from importlib import resources; from roguard import FlowLedger, ToolGateway, minimize_disclosure; assert b"Interaction Lab" in resources.read_binary("roguard", "lab.html")'
          "$RUNNER_TEMP/roguard-wheel-venv/bin/roguard-conversation" --jsonl "$GITHUB_WORKSPACE/examples/conversations.jsonl" > conversations.jsonl
          "$RUNNER_TEMP/roguard-wheel-venv/bin/roguard-compare-reports" conversations.jsonl conversations.jsonl > /dev/null
          "$RUNNER_TEMP/roguard-wheel-venv/bin/roguard-v1-annotate" --help > /dev/null
          "$RUNNER_TEMP/roguard-wheel-venv/bin/roguard-v1-author-check" --help > /dev/null
          "$RUNNER_TEMP/roguard-wheel-venv/bin/roguard-predict-bilingual" --help > /dev/null
          "$RUNNER_TEMP/roguard-wheel-venv/bin/roguard-replay-bilingual" --help > /dev/null
      - name: Export exact review bundle from packaged module
        run: |
          cd "$RUNNER_TEMP"
          "$RUNNER_TEMP/roguard-wheel-venv/bin/python" -m roguard.review_bundle --root "$GITHUB_WORKSPACE" --language ro --output "$RUNNER_TEMP/ro-review.zip" > /dev/null
          "$RUNNER_TEMP/roguard-wheel-venv/bin/python" -c 'import zipfile; archive = zipfile.ZipFile("ro-review.zip"); assert "taxonomy/taxonomy_ro.md" in archive.namelist()'
          "$RUNNER_TEMP/roguard-wheel-venv/bin/python" -m roguard.review_bundle --root "$GITHUB_WORKSPACE" --language uk --candidate-v1 --output "$RUNNER_TEMP/uk-v1-review.zip" > /dev/null
          "$RUNNER_TEMP/roguard-wheel-venv/bin/python" -c 'import zipfile; archive = zipfile.ZipFile("uk-v1-review.zip"); assert "taxonomy/taxonomy_uk_v1_candidate.md" in archive.namelist()'

  windows-unicode-install:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build and install package
        run: python -m pip install .
      - name: Verify installed bilingual CLIs with legacy encoding
        working-directory: ${{ runner.temp }}
        run: python "$env:GITHUB_WORKSPACE/scripts/smoke_unicode_install.py"
