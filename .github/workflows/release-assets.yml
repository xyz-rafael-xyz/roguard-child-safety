name: Release assets

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Verify tag matches package version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          assert os.environ["RELEASE_TAG"] == f"v{version}", "Release tag/version mismatch"
          PY
      - name: Build versioned wheel and stable-name source archive
        run: |
          python -m pip install 'setuptools>=69'
          python -c 'from setuptools.build_meta import build_sdist; build_sdist("dist")'
          python -m pip wheel . --no-deps --no-build-isolation --wheel-dir dist
          mv dist/roguard_local-*.tar.gz dist/roguard-local-latest.tar.gz
      - name: Smoke-test source archive
        run: |
          python -m venv "$RUNNER_TEMP/roguard-release-test"
          "$RUNNER_TEMP/roguard-release-test/bin/python" -m pip install dist/roguard-local-latest.tar.gz
          "$RUNNER_TEMP/roguard-release-test/bin/roguard-message-screen" examples/message_screen_ro.json > /dev/null
          "$RUNNER_TEMP/roguard-release-test/bin/roguard-message-screen" examples/message_screen_uk.json > /dev/null
      - name: Publish release with installable assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/roguard-local-latest.tar.gz dist/roguard_local-*.whl --title "RoGuard Local ${RELEASE_TAG#v}" --generate-notes
